# RocksDB Options File
#
# This file is loaded by db_bench via --options_file.
# It configures the RocksDB engine (DB options, column family options,
# and table/block-cache options).
#
# Note: when --options_file is used, db_bench ignores most command-line
# flags that overlap with these settings. Only a handful of CLI flags
# are still honored (--use_existing_db, --statistics, --row_cache_size,
# --num_multi_db, etc). See --help for details.
#
# CF / table / DB parallelism below match bench/LHS/results.csv
# sample_index=6 (best throughput_qps with kCompactionStyleLevel).

[Version]
  rocksdb_version=11.1.0
  options_file_version=1.1

[DBOptions]
  create_if_missing=true                          # default: false
  max_background_jobs=4
  max_subcompactions=1
  max_background_compactions=-1
  # max_background_compactions=4                  # tuned: explicit compaction threads
  max_background_flushes=-1
  # max_background_flushes=2                      # tuned: explicit flush threads
  bytes_per_sync=0
  # bytes_per_sync=1048576                        # tuned: 1MB periodic sync
  wal_bytes_per_sync=0
  # wal_bytes_per_sync=1048576                    # tuned: 1MB periodic WAL sync
  max_total_wal_size=0
  max_open_files=-1
  stats_dump_period_sec=600
  # stats_dump_period_sec=60                      # tuned: more frequent stats
  advise_random_on_open=true
  use_fsync=false
  allow_concurrent_memtable_write=true
  enable_pipelined_write=false
  enable_write_thread_adaptive_yield=true

[CFOptions "default"]
  write_buffer_size=62839682
  max_write_buffer_number=3
  min_write_buffer_number_to_merge=1
  num_levels=7
  level0_file_num_compaction_trigger=5
  level0_slowdown_writes_trigger=20
  level0_stop_writes_trigger=36
  max_bytes_for_level_base=227208189
  max_bytes_for_level_multiplier=11.914889790996936
  target_file_size_base=213146705
  target_file_size_multiplier=1
  compression=kNoCompression
  # compression=kSnappyCompression                 # default when Snappy is linked
  compaction_style=kCompactionStyleLevel
  level_compaction_dynamic_level_bytes=true
  bloom_locality=0
  optimize_filters_for_hits=false

[TableOptions/BlockBasedTable "default"]
  block_size=9549
  format_version=7
  # format_version=5                              # tuned: older compatible format
  index_type=kBinarySearch
  whole_key_filtering=true
  checksum=kXXH3
  cache_index_and_filter_blocks=false
  # cache_index_and_filter_blocks=true            # tuned: cache meta-blocks
  # pin_l0_filter_and_index_blocks_in_cache=true  # tuned: pin L0 meta-blocks
  filter_policy=rocksdb.EvolveDummyFilter
