# Read-only random point reads for cache tier sizing (evolve-cache).
# Pair with load.ini (fillrandom) and bench/bench.ini shared flags.
# 100% readrandom — no writes during measurement, so hit-rate signals reflect
# read path caching only (primary vs secondary vs disk).

benchmarks=readrandom
use_existing_db=1
read_random_exp_range=2
disable_auto_compactions=1