# Shared db_bench parameters for YCSB benchmarks.
#
# These are db_bench command-line flags that apply across all workloads.
# RocksDB engine tuning (write_buffer_size, bloom filter, etc.) belongs
# in rocksdb_options.ini instead.

# Database path (overridden by env DB_DIR if set)
db=/tmp/rocksdb_ycsb_bench

# Dataset size
num=103244406
key_size=16
value_size=1024

# Parallelism
threads=16

# Run duration (seconds) for each workload phase
duration=300

# Compression (applied via CLI; also set in rocksdb_options.ini for engine)
compression_type=none

# Reporting
histogram=true
statistics=false
